x-common: &common
  restart: unless-stopped

services:
  main:
    <<: *common
    build:
      context: ./xu-ly-du-lieu
      dockerfile: Dockerfile
    container_name: tj-main
    # không ghi đè command: dùng CMD gunicorn trong Dockerfile
    ports:
      - "8000:5000"
    volumes:
      - labbook_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/login', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  labbook_data:
